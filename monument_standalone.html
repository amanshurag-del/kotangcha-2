<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotangcha — Standalone Monument</title>
    <style>
        body { margin: 0; background: #faf9f7; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #tip {
            position: absolute; display: none;
            background: rgba(250, 249, 247, 0.98);
            border: 0.5px solid rgba(0,0,0,0.1);
            border-radius: 8px; padding: 12px 16px;
            font-size: 13px; max-width: 220px;
            pointer-events: none; line-height: 1.6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 100;
        }
        .name { font-weight: 500; color: #1a1917; margin-bottom: 2px; }
        .obj { color: #6b6760; font-size: 12px; }
        .place { color: #b0ada8; font-size: 11px; margin-top: 4px; font-style: italic; }
        .hint {
            position: absolute; bottom: 24px; left: 0; right: 0;
            text-align: center; color: #b0ada8; font-size: 11px;
            letter-spacing: 0.1em; text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="tip">
    <div class="name" id="tip-name"></div>
    <div class="obj" id="tip-obj"></div>
    <div class="place" id="place"></div>
</div>

<div class="hint">Drag to orbit · scroll to zoom · hover objects</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance', precision: 'highp' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    camera.position.set(10, 8, 14);

    // Lighting
    scene.add(new THREE.AmbientLight(0xfcfaf7, 0.9));
    const sun = new THREE.DirectionalLight(0xfffdfa, 0.6);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = sun.shadow.mapSize.height = 4096;
    scene.add(sun);
    
    const rim = new THREE.DirectionalLight(0xffffff, 0.2);
    rim.position.set(-10, 10, -10);
    scene.add(rim);

    // Procedural Textures
    function stoneTex(seed, bH, bS, bL) {
        const sz = 1024; const cv = document.createElement('canvas');
        cv.width = cv.height = sz; const ctx = cv.getContext('2d', { alpha: false });
        const rng = s => { let x = Math.sin(s + 1) * 10000; return x - Math.floor(x); };
        ctx.fillStyle = `hsl(${bH},${bS}%,${bL}%)`; ctx.fillRect(0,0,sz,sz);
        let y = 0, row = 0;
        while (y < sz) {
            const rh = (18 + rng(seed + row) * 10) * 4;
            ctx.fillStyle = `hsl(${bH},${Math.max(0,bS-15)}%,${Math.max(20,bL-18)}%)`;
            ctx.fillRect(0, y, sz, 4);
            let x = rng(seed + row * 100) * 80, col = 0;
            while (x < sz) {
                const sw = (28 + rng(seed + row * 100 + col) * 28) * 4;
                ctx.fillStyle = `hsl(${bH},${Math.max(0,bS-12)}%,${Math.max(20,bL-14)}%)`;
                ctx.fillRect(x, y+4, 3, rh-4);
                const l2 = bL + (rng(seed + row + col + 1) - 0.5) * 16;
                ctx.fillStyle = `hsl(${bH + rng(seed+row+col)*8-4},${bS}%,${l2}%)`;
                ctx.fillRect(x+3, y+4, sw-3, rh-4);
                x += sw; col++;
            }
            y += rh; row++;
        }
        const t = new THREE.CanvasTexture(cv); 
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return t;
    }

    function prayerFlagTex() {
        const w = 512, h = 2560; const cv = document.createElement('canvas');
        cv.width = w; cv.height = h; const ctx = cv.getContext('2d');
        ctx.fillStyle = '#f5f2eb'; ctx.fillRect(0, 0, w, h);
        const segH = h / 5;
        for (let i = 0; i < 5; i++) {
            const yOff = i * segH;
            ctx.strokeStyle = 'rgba(0,0,0,0.03)'; ctx.lineWidth = 4;
            ctx.strokeRect(16, yOff + 16, w - 32, segH - 32);
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; const cx = w/2, cy = yOff + segH/2;
            ctx.fillRect(cx - 2, cy - 40, 4, 80); ctx.fillRect(cx - 40, cy - 2, 80, 4);
        }
        const t = new THREE.CanvasTexture(cv); 
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return t;
    }

    const st1 = stoneTex(42, 42, 22, 62); st1.repeat.set(2,2);
    const st2 = stoneTex(77, 40, 18, 58); st2.repeat.set(1.5,1.5);
    const pfTex = prayerFlagTex();

    const matStone1 = new THREE.MeshLambertMaterial({ map: st1 });
    const matStone2 = new THREE.MeshLambertMaterial({ map: st2 });
    const matSlab = new THREE.MeshLambertMaterial({ color: 0x888c90 });
    const matNiche = new THREE.MeshLambertMaterial({ color: 0x4a4e52 });

    function box(w,h,d,mat,x,y,z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
        m.position.set(x,y,z); m.castShadow = m.receiveShadow = true;
        scene.add(m); return m;
    }

    // Monument
    box(4.8, 2.6, 4.8, matStone1, 0, 1.3, 0);
    box(5.4, 0.18, 5.4, matSlab, 0, 2.69, 0);
    box(4.0, 0.14, 1.1, matSlab, 0, 1.6, 2.95); box(4.0, 0.14, 1.1, matSlab, 0, 1.6, -2.95);
    box(1.1, 0.14, 4.0, matSlab, 2.95, 1.6, 0); box(1.1, 0.14, 4.0, matSlab, -2.95, 1.6, 0);
    box(3.4, 2.4, 3.4, matStone2, 0, 4.07, 0);
    box(4.0, 0.18, 4.0, matSlab, 0, 5.35, 0);
    box(2.2, 2.0, 2.2, matStone1, 0, 6.44, 0);
    box(2.8, 0.18, 2.8, matSlab, 0, 7.52, 0);
    box(1.6, 0.8, 1.6, matStone2, 0, 8.0, 0);
    box(2.0, 0.14, 2.0, matSlab, 0, 8.41, 0);

    // Pole & Flag
    const pole = box(0.08, 4.5, 0.08, new THREE.MeshLambertMaterial({color: 0x8a7355}), 0.05, 10.65, 0.05);
    const flagGeo = new THREE.PlaneGeometry(0.55, 2.8, 8, 12);
    const flag = new THREE.Mesh(flagGeo, new THREE.MeshLambertMaterial({map: pfTex, side: THREE.DoubleSide, transparent: true, opacity: 0.95}));
    flag.position.set(0.33, 11.4, 0.05);
    scene.add(flag);

    // Offerings logic and list
    const meshToData = new Map();
    const OFFERING_DATA = [
        { name: 'Priya', place: 'Shimla', obj: 'A clay water pot' },
        { name: 'Tenzing', place: 'Reckong Peo', obj: 'A brass lamp' },
        { name: 'Meera', place: 'Kullu', obj: 'A woollen shawl' },
        { name: 'Anjali', place: 'Delhi', obj: 'A handwritten poem' },
        { name: 'Dorje', place: 'Nako', obj: 'A wooden bowl' },
        { name: 'Rahul', place: 'Chandigarh', obj: 'A glass bottle' },
        { name: 'Sunita', place: 'Sarahan', obj: 'A dried marigold' }
    ];

    const SLOTS = [
        { x: -1.2, y: 2.85, z: 2.0, type: 'pot' },
        { x: 0, y: 2.82, z: 2.1, type: 'vessel' },
        { x: 1.1, y: 2.78, z: 2.0, type: 'cloth' },
        { x: 2.2, y: 2.8, z: 0.3, type: 'scroll' },
        { x: 2.1, y: 2.78, z: -0.5, type: 'bowl' },
        { x: -2.2, y: 2.8, z: 0, type: 'bottle' },
        { x: 0.2, y: 2.81, z: -2.3, type: 'flower' }
    ];

    const mats = {
        pot: new THREE.MeshLambertMaterial({color: 0xb5673a}),
        vessel: new THREE.MeshLambertMaterial({color: 0xc8972a}),
        cloth: new THREE.MeshLambertMaterial({color: 0x8b4a6e}),
        scroll: new THREE.MeshLambertMaterial({color: 0xe8dfc8}),
        bowl: new THREE.MeshLambertMaterial({color: 0x7a5230}),
        bottle: new THREE.MeshLambertMaterial({color: 0x9ab8c8, transparent: true, opacity: 0.7}),
        flower: new THREE.MeshLambertMaterial({color: 0xd44a4a})
    };

    SLOTS.forEach((s, i) => {
        let geo;
        if (s.type === 'pot') geo = new THREE.CylinderGeometry(0.12, 0.17, 0.28, 16);
        else if (s.type === 'vessel') geo = new THREE.CylinderGeometry(0.09, 0.12, 0.22, 12);
        else if (s.type === 'cloth') geo = new THREE.BoxGeometry(0.22, 0.06, 0.16);
        else if (s.type === 'scroll') geo = new THREE.CylinderGeometry(0.045, 0.045, 0.18, 10);
        else if (s.type === 'bowl') geo = new THREE.CylinderGeometry(0.14, 0.1, 0.1, 16);
        else if (s.type === 'bottle') geo = new THREE.CylinderGeometry(0.07, 0.09, 0.24, 10);
        else geo = new THREE.SphereGeometry(0.07, 8, 6);

        const m = new THREE.Mesh(geo, mats[s.type]);
        m.position.set(s.x, s.y, s.z);
        if (s.type === 'scroll') m.rotation.z = Math.PI/2;
        m.castShadow = m.receiveShadow = true;
        scene.add(m);
        meshToData.set(m, OFFERING_DATA[i % OFFERING_DATA.length]);
    });

    // Interaction
    let isDragging = false, theta = 0.5, phi = 0.55, radius = 18;
    let prevX = 0, prevY = 0;
    const target = new THREE.Vector3(0, 5, 0);

    const updateCam = () => {
        camera.position.set(
            target.x + radius * Math.sin(phi) * Math.sin(theta),
            target.y + radius * Math.cos(phi),
            target.z + radius * Math.sin(phi) * Math.cos(theta)
        );
        camera.lookAt(target);
    };

    window.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
        if (isDragging) {
            theta -= (e.clientX - prevX) * 0.007;
            phi = Math.max(0.1, Math.min(1.4, phi + (e.clientY - prevY) * 0.005));
            prevX = e.clientX; prevY = e.clientY;
        }
    });

    // Touch Support
    let initialPinchDist = 0;
    let initialRadius = radius;

    window.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            e.preventDefault();
            isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
            autoRotate = false;
        } else if (e.touches.length === 2) {
            e.preventDefault();
            isDragging = false;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialPinchDist = Math.sqrt(dx * dx + dy * dy);
            initialRadius = radius;
            autoRotate = false;
        }
    }, {passive: false});
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && isDragging) {
            e.preventDefault();
            const touch = e.touches[0];
            theta -= (touch.clientX / window.innerWidth - prevX / window.innerWidth) * 7;
            phi = Math.max(0.1, Math.min(1.4, phi + (touch.clientY / window.innerHeight - prevY / window.innerHeight) * 5));
            prevX = touch.clientX; prevY = touch.clientY;
            
            // Interaction on touchmove/tap
            const mx = (touch.clientX / window.innerWidth) * 2 - 1;
            const my = -(touch.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera({x: mx, y: my}, camera);
            const hits = raycaster.intersectObjects(scene.children);
            const hit = hits.find(h => meshToData.has(h.object));
            if (hit) {
                const d = meshToData.get(hit.object);
                document.getElementById('tip-name').textContent = d.name;
                document.getElementById('tip-obj').textContent = d.obj;
                document.getElementById('place').textContent = d.place;
                tip.style.display = 'block';
                tip.style.left = touch.clientX + 14 + 'px';
                tip.style.top = touch.clientY - 40 + 'px';
            } else { tip.style.display = 'none'; }
        } else if (e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const diff = dist - initialPinchDist;
            radius = Math.max(8, Math.min(30, initialRadius - diff * 0.05));
        }
    }, {passive: false});

    window.addEventListener('wheel', e => { radius = Math.max(8, Math.min(30, radius + e.deltaY * 0.02)); }, {passive: false});

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tip = document.getElementById('tip');

    window.addEventListener('mousemove', e => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(scene.children);
        const hit = hits.find(h => meshToData.has(h.object));
        if (hit) {
            const d = meshToData.get(hit.object);
            document.getElementById('tip-name').textContent = d.name;
            document.getElementById('tip-obj').textContent = d.obj;
            document.getElementById('place').textContent = d.place;
            tip.style.display = 'block';
            tip.style.left = e.clientX + 14 + 'px';
            tip.style.top = e.clientY - 40 + 'px';
        } else { tip.style.display = 'none'; }
    });

    let ft = 0, animTime = 0;
    function animate() {
        requestAnimationFrame(animate);
        ft += 0.03; animTime += 0.008;
        if (!isDragging) {
            theta += 0.004;
            target.y = 5 + Math.sin(animTime) * 0.1;
        }
        if (flag) {
            const pos = flag.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i); const y = pos.getY(i);
                pos.setZ(i, Math.sin(ft * 1.5 + y * 2) * (x + 0.3) * 0.12);
            }
            pos.needsUpdate = true;
            flag.rotation.y = Math.sin(ft * 0.5) * 0.08;
        }
        updateCam();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
